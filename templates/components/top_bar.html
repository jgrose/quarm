<div id="topBar">
  <div class="logo">NORT</div>
  <div id="sessionTabs"></div>
  <div id="sessionStats">0/0 TASKS</div>
  <div id="connectionStatus">
    <span class="status-dot disconnected"></span>
    <span id="connectionText">OFFLINE</span>
  </div>
  <div class="top-bar-actions">
    <button id="viewToggleBtn" onclick="window.location.href='/flow'" title="Switch to flow view">FLOW</button>
    <button onclick="toggleQueue()" title="Toggle queue (Q)">QUEUE</button>
    <button id="asksBtn" aria-expanded="false" onclick="toggleAsksPanel()" title="Pending agent questions (K)">
      ASKS (<span id="asksCount">0</span>)
    </button>
    <button onclick="toggleLedger()" title="Toggle ledger">LEDGER</button>
    <button onclick="toggleCostPanel()" title="Toggle costs ($)">COSTS</button>
    <button onclick="loadModels()" title="Configure models">MODELS</button>
    <button onclick="loadReviewStats()" title="Review analytics">REVIEWS</button>
    <button onclick="loadTolerance()" title="Tolerance config">TOLERANCE</button>
    <button onclick="toggleAgentsPanel()" title="Toggle agents (A)">AGENTS</button>
    <button onclick="toggleHelp()" class="btn-icon" title="Keyboard shortcuts (?)">?</button>
    <button onclick="toggleConfigOverlay()" class="btn-icon" title="Settings (ESC to close)">&#9881;</button>
  </div>
</div>
