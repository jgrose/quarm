<div id="outputBrowserOverlay" class="hidden" onclick="this.classList.add('hidden')">
  <div class="output-browser-card glass-card" onclick="event.stopPropagation()">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div class="config-title" style="margin:0">OUTPUT BROWSER</div>
      <div style="display:flex;gap:8px;align-items:center">
        <button class="btn-sm" id="outputDownloadBtn" onclick="downloadArtifacts()" style="font-size:9px;padding:4px 10px">DOWNLOAD ZIP</button>
        <span style="font-size:8px;color:var(--text-muted);letter-spacing:0.5px">ESC</span>
        <button class="close-btn" onclick="document.getElementById('outputBrowserOverlay').classList.add('hidden')">&times;</button>
      </div>
    </div>
    <div style="display:flex;gap:12px;height:calc(100% - 48px)">
      <div id="outputFileTree" class="output-tree"></div>
      <div id="outputFilePreview" class="output-preview">
        <div class="output-preview-placeholder">Select a file to preview</div>
      </div>
    </div>
  </div>
</div>
