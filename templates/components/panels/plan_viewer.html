<div id="planViewer" class="hidden">
  <div class="plan-viewer-card glass-card" onclick="event.stopPropagation()">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
      <div class="config-title" style="margin:0">PLAN</div>
      <button class="close-btn" onclick="hidePlanViewer()">&times;</button>
    </div>
    <pre id="planContent" style="font-size:10px;line-height:1.6;white-space:pre-wrap;word-wrap:break-word;max-height:60vh;overflow-y:auto;color:var(--text-primary)"></pre>
  </div>
</div>
