<div id="controlBar">
  <input id="planInput" type="text" placeholder="Describe your project..." autocomplete="off">
  <button id="btnGenerate" onclick="generatePlan()" title="Generate plan from description">GENERATE</button>
  <button onclick="showOutputBrowser()" title="Browse output files (ESC to close)">OUTPUT</button>
  <div id="heartbeat">
    <span class="heartbeat-dot"></span>
    <span id="heartbeatText">IDLE</span>
  </div>
</div>
